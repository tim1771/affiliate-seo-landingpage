<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Detection</title>
</head>

<body>
    <!-- 
      This form is for Netlify's build-time bot to discover the form.
      It must match the name and fields used in the React component.
    -->
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="waitlist" />
        <input name="bot-field" />
        <input type="email" name="email" required />
    </form>
</body>

</html>
